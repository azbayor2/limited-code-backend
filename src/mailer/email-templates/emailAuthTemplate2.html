<!doctype html>

<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <title>Y LIMITED</title>
  </head>

  <body style="font-family: sans-serif">
    <table
      align="center"
      style="
        background-color: #e8e2d4;
        border-radius: 8px;
        width: fit-content;
        padding: 8px 16px;
      "
    >
      <tr>
        <td
          align="center"
          style="
            font-size: x-large;
            border-bottom: #1f1f1f;
            border-bottom-style: solid;
            border-bottom-width: 1px;
          "
        >
          안녕하세요, 인증번호 입니다.
        </td>
      </tr>

      <tr>
        <td
          align="center"
          style="font-size: larger; padding-bottom: 8px; padding-top: 32px"
        >
          인증번호:
        </td>
      </tr>

      <tr>
        <td align="center" style="font-size: larger">
          <div
            style="
              width: fit-content;
              height: fit-content;
              border-color: #1f1f1f;
              border-style: solid;
              border-radius: 8px;
              background-color: #f0f0f0;
              border-width: 1px;
              padding: 4px 8px;
              font-size: medium;
            "
          >
            {{authenticationCode}}
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
